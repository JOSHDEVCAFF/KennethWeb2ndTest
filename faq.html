<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#e7f7fb"><title>FAQ — Ashleyloyleyy Coffee House</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><script src="app.js" defer></script></head><body>
  <div id="app"></div>
  <template id="page-content">
<section class="page-intro">
      <span class="eyebrow">The little details</span>
      <h1 class="page-title">A few good questions</h1>
      <p>Everything you might want to know before your first sip, visit, or coffee order.</p>
      </section>
      <section class="content-panel faq-list">
      <details>
      <summary>Do you have dairy-free milk?</summary>
      <p>Absolutely. Oat milk is always on the bar, and we can make nearly all espresso drinks with it.</p>
      </details>
      <details>
      <summary>Can you help with food allergies?</summary>
      <p>Our pastries are prepared in a kitchen that handles wheat, dairy, eggs, nuts, and sesame. Ask us for ingredient details before ordering.</p>
      </details>
      <details>
      <summary>Can I get my beans ground?</summary>
      <p>Of course. Choose the grind that suits your brewer when you order, or tell us what you use at the counter.</p>
      </details>
      <details>
      <summary>Is there Wi-Fi?</summary>
      <p>Yes, complimentary Wi-Fi is available for cafe guests. Seating is shared and first come, first served.</p>
      </details>
      <details>
      <summary>Do you take reservations?</summary>
      <p>We welcome walk-ins and offer reservations for select tables. Choose a table on our reservation page.</p>
      </details>
      <details>
      <summary>Can I bring my dog?</summary>
      <p>Leashed dogs are welcome on our patio. Service animals are welcome throughout the cafe.</p>
      </details>
      </section>
      <p class="inline-note">Still wondering? <a class="text-link" href="contact.html">Send us a note →</a>
      </p>
  </template>
</body>
</html>
