<section class="page-intro">
      <span class="eyebrow">Our story</span>
      <h1 class="page-title">A little coffee, a lot of heart</h1>
      <p>From one espresso machine on a quiet corner to a roastery and a room full of familiar faces.</p>
      </section>
      <section class="content-panel">
      <div class="timeline">
      <article class="timeline-item">
      <strong>2018</strong>
      <h3>One little espresso bar</h3>
      <p>We opened our first tiny corner with one espresso machine, four stools, and beans from producers we were proud to know.</p>
      </article>
      <article class="timeline-item">
      <strong>2020</strong>
      <h3>Making a little more room</h3>
      <p>The neighborhood grew around us. We found a bigger space, added a bakery counter, and started roasting a few blends of our own.</p>
      </article>
      <article class="timeline-item">
      <strong>2022</strong>
      <h3>A roastery of our own</h3>
      <p>A small drum roaster arrived. Our first house blend was born, and fresh bags began finding their way into local kitchens.</p>
      </article>
      <article class="timeline-item">
      <strong>Today</strong>
      <h3>Still growing, still neighbors</h3>
      <p>A cafe, roastery, and familiar neighborhood gathering place. Same simple hope: make every visit feel a little like coming home.</p>
      </article>
      </div>
      </section>
