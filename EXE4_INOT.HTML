<!DOCTYPE html>
<html>
<head>
    <title>Font Attributes Showcase (Modern CSS) — Kenneth Inot</title>
</head>
<body>
    <h2>Font Styling Attributes (Modern CSS)</h2>

    <p><b>Text Color:</b><br>
    <span style="color:crimson;">Crimson text</span><br>
    <span style="color:#0369a1;">Ocean Blue text</span><br>
    <span style="color:teal;">Teal text</span></p>

    <p><b>Font Size:</b><br>
    <span style="font-size:xx-small;">Size 1 (smallest)</span><br>
    <span style="font-size:medium;">Size 3 (default)</span><br>
    <span style="font-size:x-large;">Size 5</span><br>
    <span style="font-size:xx-large;">Size 7 (largest)</span></p>

    <p><b>Font Face / Family:</b><br>
    <span style="font-family:Arial;">Arial font</span><br>
    <span style="font-family:'Times New Roman';">Times New Roman</span><br>
    <span style="font-family:'Courier New', monospace;">Courier New</span></p>

    <p><b>Combined Styling:</b><br>
    <span style="color:navy; font-size:xx-large; font-family:Verdana;">Navy Blue, Size 7, Verdana</span></p>
</body>
</html>
