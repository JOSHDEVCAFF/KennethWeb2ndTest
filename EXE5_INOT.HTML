<!DOCTYPE html>
<html>
<head>
    <title>Other Text Formatting Tags — Kenneth Inot</title>
</head>
<body>
    <h2>Sample Output — Kenneth Inot (BSIT - MCC):</h2>

    <p><i>Italic</i></p>
    <p><u>Underline</u></p>

    <!-- Additional common formatting tags -->
    <p><b>Bold</b></p>
    <p><big>Big Text</big></p>
    <p><small>Small Text</small></p>
    <p><strong>Strong Text</strong></p>
    <p><em>Emphasized Text</em></p>
    <p><mark>Marked / Highlighted Text</mark></p>
    <p><del>Deleted / Strikethrough Text</del></p>
    <p><ins>Inserted Text</ins></p>
    <p><sub>Subscript</sub> Example: CO<sub>2</sub></p>
    <p><sup>Superscript</sup> Example: 2<sup>10</sup> = 1024</p>

</body>
</html>
