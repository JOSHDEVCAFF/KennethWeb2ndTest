<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#e7f7fb"><title>Contact — Ashleyloyleyy Coffee House</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><script src="app.js" defer></script></head><body>
  <div id="app"></div>
  <template id="page-content">
<section class="page-intro">
      <span class="eyebrow">Say hello</span>
      <h1 class="page-title">We’d love to hear from you</h1>
      <p>Questions about the menu, an event, or just what’s brewing? We’re always happy to chat.</p>
      </section>
      <div class="contact-grid">
      <section class="content-panel">
      <h2>Come find us.</h2>
      <div class="contact-detail">
      <span>⌖</span>
      <div>
      <strong>Our neighborhood</strong>
      <small>28 Willow Street, Portland, OR 97205<br>Just around the corner from the little park.</small>
      </div>
      </div>
      <div class="contact-detail">
      <span>◷</span>
      <div>
      <strong>When the lights are on</strong>
      <small>Every day · 7 am–5 pm<br>Espresso till 4:30 pm, pastries till they’re gone.</small>
      </div>
      </div>
      <div class="contact-detail">
      <span>✉</span>
      <div>
      <strong>A note for the team</strong>
      <small>hello@ashleyloyleyy.coffee</small>
      </div>
      </div>
      </section>
      <form class="content-panel contact-form" id="contact-form">
      <h2 class="full">Send us a little note.</h2>
      <div class="form-field">
      <label for="contact-name">Your name</label>
      <input id="contact-name" name="name" autocomplete="name" required>
      </div>
      <div class="form-field">
      <label for="contact-email">Email address</label>
      <input id="contact-email" name="email" type="email" autocomplete="email" required>
      </div>
      <div class="form-field full">
      <label for="contact-topic">What’s on your mind?</label>
      <select id="contact-topic" name="topic">
      <option>Just saying hello</option>
      <option>Private event or catering</option>
      <option>Menu or allergen question</option>
      </select>
      </div>
      <div class="form-field full">
      <label for="contact-message">Your message</label>
      <textarea id="contact-message" name="message" required>
      </textarea>
      </div>
      <div class="full">
      <button class="button" type="submit">Send your note</button>
      <p class="form-result" aria-live="polite">
      </p>
      </div>
      </form>
      </div>
  </template>
</body>
</html>
